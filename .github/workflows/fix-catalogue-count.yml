name: Fix catalogue count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update catalogue count
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '♫ SONGS CATALOGUE — 29'
          new = '♫ SONGS CATALOGUE — 45'
          if old not in s:
              raise SystemExit('Expected catalogue label not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-catalogue-count.yml
          git commit -m "Fix songs catalogue count to 45"
          git push
