name: Fix released covers final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-released-covers-final.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact uploaded released covers and Spotify links
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NASOS FINAL RELEASED COVERS AND SPOTIFY V3 -->'
          s=re.sub(r'<!-- NASOS FINAL RELEASED COVERS AND SPOTIFY(?: V2| V3)? -->.*?</script>\s*','',s,flags=re.S)
          patch=r'''<!-- NASOS FINAL RELEASED COVERS AND SPOTIFY V3 -->
<script>
(function(){
  const covers={
    'Δεν Με Ξέρεις':'DEN_ME_XEREIS_NASOS_DistroKid_3000x3000.png',
    'Μη Φύγεις':'ΜΗ ΦΥΓΕΙΣ.jpg'
  };
  const spotify={
    'Δεν Με Ξέρεις':'https://open.spotify.com/search/'+encodeURIComponent('ΝΑΣΟΣ Δεν Με Ξέρεις'),
    'Μη Φύγεις':'https://open.spotify.com/search/'+encodeURIComponent('ΝΑΣΟΣ Μη Φύγεις'),
    'Μη Μου Λες Αντίο':'https://open.spotify.com/search/'+encodeURIComponent('ΝΑΣΟΣ Μη Μου Λες Αντίο'),
    'Δώσε Μου Θάλασσα Να Πιω':'https://open.spotify.com/search/'+encodeURIComponent('ΝΑΣΟΣ Δώσε Μου Θάλασσα Να Πιω')
  };
  function fix(){
    document.querySelectorAll('.music').forEach(card=>{
      const text=(card.innerText||'').replace(/\s+/g,' ');
      const title=Object.keys(spotify).find(t=>text.includes(t));
      if(!title)return;
      const cover=card.querySelector('.cover');
      if(covers[title]&&cover){
        cover.classList.add('real-cover');
        cover.innerHTML='<img src="'+covers[title]+'" alt="'+title+' — ΝΑΣΟΣ" style="width:100%;height:100%;object-fit:cover;display:block;">';
        cover.style.padding='0';cover.style.overflow='hidden';
      }
      if(!card.querySelector('.spotify-v3-link')){
        const a=document.createElement('a');
        a.className='spotify-v3-link';
        a.href=spotify[title];
        a.target='_blank';a.rel='noopener noreferrer';a.textContent='♫ SPOTIFY';
        a.style.cssText='display:inline-block;margin:10px 0 0 10px;padding:10px 18px;border:1px solid #555;color:#eee;background:transparent;text-decoration:none;font-weight:700;';
        const button=card.querySelector('button');
        if(button&&button.parentNode)button.parentNode.appendChild(a);else card.appendChild(a);
      }
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',fix);else fix();
  setTimeout(fix,500);setTimeout(fix,1500);
})();
</script>
'''
          s=s.replace('</body>',patch+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply exact released covers and Spotify links'
          git push
