name: Connect Songs Catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-songs-catalogue.yml'

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4

      - name: Fix Songs Catalogue button count
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          old_labels = [
              'SONGS CATALOGUE — 26',
              'SONGS CATALOGUE - 26',
              'SONGS CATALOGUE 26',
          ]
          new_label = 'SONGS CATALOGUE — 29'

          changed = False
          for old in old_labels:
              if old in text:
                  text = text.replace(old, new_label)
                  changed = True

          if changed:
              p.write_text(text, encoding='utf-8')
              print('Songs Catalogue count changed from 26 to 29.')
          else:
              print('No old 26-count label found; leaving index.html unchanged.')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update songs catalogue count to 29"
            git push
          fi
