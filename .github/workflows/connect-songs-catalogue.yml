name: Restore Released Songs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/connect-songs-catalogue.yml'

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore homepage Music section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')

          music = '''<section id="music" class="dark">
          <div class="eyebrow">MUSIC</div>
          <h2>Μουσική</h2>
          <div style="max-width:1200px;margin:0 auto 45px;">
            <div class="eyebrow" style="text-align:center;margin-bottom:10px;">ΚΥΚΛΟΦΟΡΗΜΕΝΑ</div>
            <h3 style="text-align:center;font-size:28px;margin:0 0 28px;">Τα τραγούδια μου</h3>
            <div class="cards">
              <article class="music"><div class="cover real-cover"><img src="DEN_ME_XEREIS_3000x3000.png" alt="Δεν Με Ξέρεις"></div><h3>Δεν Με Ξέρεις</h3><p>Κυκλοφορημένο τραγούδι</p><button onclick="demo('ΔΕΝ ΜΕ ΞΕΡΕΙΣ',this)">▶ ΑΚΟΥΣΕ ΤΟ ΤΡΑΓΟΥΔΙ</button></article>
              <article class="music"><div class="cover">ΜΦ</div><h3>Μη Φύγεις</h3><p>Κυκλοφορημένο τραγούδι</p><button onclick="demo('ΜΗ ΦΥΓΕΙΣ',this)">▶ ΑΚΟΥΣΕ ΤΟ ΤΡΑΓΟΥΔΙ</button></article>
              <article class="music"><div class="cover real-cover"><img src="MH_MOU_LES_ANTIO_3000x3000.png" alt="Μη Μου Λες Αντίο"></div><h3>Μη Μου Λες Αντίο</h3><p>Κυκλοφορημένο τραγούδι</p><button onclick="demo('ΜΗ ΜΟΥ ΛΕΣ ΑΝΤΙΟ',this)">▶ ΑΚΟΥΣΕ ΤΟ ΤΡΑΓΟΥΔΙ</button></article>
              <article class="music"><div class="cover real-cover"><img src="NASOS_Dose_Mou_Thalassa_Na_Pio_DistroKid_3000x3000.jpg" alt="Δώσε Μου Θάλασσα Να Πιω"></div><h3>Δώσε Μου Θάλασσα Να Πιω</h3><p>Κυκλοφορημένο τραγούδι</p><button onclick="demo('ΔΩΣΕ ΜΟΥ ΘΑΛΑΣΣΑ ΝΑ ΠΙΩ',this)">▶ ΑΚΟΥΣΕ ΤΟ ΤΡΑΓΟΥΔΙ</button></article>
            </div>
          </div>
          <div style="text-align:center;max-width:900px;margin:0 auto;"><p style="color:#b9b0b2;">Όλα τα διαθέσιμα τραγούδια του Νάσου βρίσκονται στον επίσημο κατάλογο.</p><a href="songs.html" style="display:inline-block;margin-top:12px;padding:14px 24px;border:1px solid #c8a56a;border-radius:6px;background:#090909;color:#c8a56a;text-decoration:none;font-weight:700;letter-spacing:2px;font-size:13px;">♫ SONGS CATALOGUE — 45</a></div>
          </section>'''

          pattern = r'<section id="music"[^>]*>.*?</section>'
          new_text, n = re.subn(pattern, music, text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Music section not found')
          p.write_text(new_text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Restore four released songs on homepage"
          git push origin HEAD:main
