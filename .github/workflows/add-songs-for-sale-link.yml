name: Connect Songs For Sale

on:
  push:
    paths:
      - 'songs-for-sale.html'
      - '.github/workflows/add-songs-for-sale-link.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Songs For Sale link to homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          link = '<a class="songs-link" href="songs-for-sale.html">SONGS FOR SALE</a>'
          if 'href="songs-for-sale.html"' not in s:
              marker = '</nav>'
              if marker not in s:
                  raise SystemExit('Navigation closing tag not found')
              s = s.replace(marker, link + marker, 1)
              css = '''\n/* Songs For Sale navigation */\n.songs-link{color:#c8a56a!important;font-weight:900;border:1px solid #6b4b53;padding:8px 12px;border-radius:5px}\n.songs-link:hover{background:#241317}\n'''
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Connect homepage to Songs For Sale"
          git push