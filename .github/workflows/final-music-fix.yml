name: Final music section fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace homepage music section only
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'<section id="music"[^>]*>.*?</section>'
          replacement = '''<section id="music" class="dark">
          <div class="eyebrow">MUSIC</div>
          <h2>Μουσική</h2>
          <div style="text-align:center;max-width:900px;margin:0 auto;">
            <p style="color:#b9b0b2;">Όλα τα διαθέσιμα τραγούδια του Νάσου βρίσκονται στον επίσημο κατάλογο.</p>
            <a href="songs.html" style="display:inline-block;margin-top:12px;padding:14px 24px;border:1px solid #c8a56a;border-radius:6px;background:#090909;color:#c8a56a;text-decoration:none;font-weight:700;letter-spacing:2px;font-size:13px;">♫ SONGS CATALOGUE — 45</a>
          </div>
          </section>'''
          s2, n = re.subn(pattern, replacement, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit(f'music section not found: {n}')
          p.write_text(s2, encoding='utf-8')
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/final-music-fix.yml
          git commit -m 'Fix homepage music section and catalogue link'
          git push
