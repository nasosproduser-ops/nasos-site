name: Fix released song cards

on:
  push:
    paths:
      - '.github/workflows/fix-released-song-cards.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch released song cards
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- NASOS RELEASED SONG CARDS PATCH -->'
          if marker not in s:
              patch=r'''<!-- NASOS RELEASED SONG CARDS PATCH -->
<script>
(function(){
  const photo='ChatGPT%20Image%2017%20%CE%91%CF%85%CE%B3%202026%2C%2012_33_57%20%CF%80.%CE%BC..png';
  const songs=[
    {title:'Δεν Με Ξέρεις',search:'ΝΑΣΟΣ Δεν Με Ξέρεις',photo:true},
    {title:'Μη Φύγεις',search:'ΝΑΣΟΣ Μη Φύγεις',photo:true},
    {title:'Μη Μου Λες Αντίο',search:'ΝΑΣΟΣ Μη Μου Λες Αντίο',photo:false},
    {title:'Δώσε Μου Θάλασσα Να Πιω',search:'ΝΑΣΟΣ Δώσε Μου Θάλασσα Να Πιω',photo:false}
  ];
  function add(){
    document.querySelectorAll('.music').forEach(card=>{
      const text=(card.innerText||'').replace(/\s+/g,' ');
      const song=songs.find(x=>text.includes(x.title));
      if(!song||card.dataset.nasosPatched)return;
      card.dataset.nasosPatched='1';
      const cover=card.querySelector('.cover');
      if(song.photo&&cover){cover.innerHTML='<img src="'+photo+'" alt="ΝΑΣΟΣ — '+song.title+'" style="width:100%;height:100%;object-fit:cover;display:block;">';cover.style.padding='0';cover.style.overflow='hidden';}
      const link=document.createElement('a');
      link.href='https://open.spotify.com/search/'+encodeURIComponent(song.search);
      link.target='_blank';link.rel='noopener';link.textContent='♫ SPOTIFY';
      link.style.cssText='display:inline-block;margin-left:10px;background:transparent;color:#eee;border:1px solid #555;padding:10px 18px;text-decoration:none;font-weight:700;';
      const b=card.querySelector('button');
      if(b&&b.parentNode)b.parentNode.appendChild(link);else card.appendChild(link);
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
'''
              p.write_text(s.replace('</body>',patch+'</body>'),encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix released song photos and Spotify links'
          git push
