name: Place songs catalogue inside Music
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Music section only
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # The catalogue must NOT appear in the homepage hero.
          s = s.replace('♫ SONGS CATALOGUE — 29', '')
          s = s.replace('♫ SONGS CATALOGUE — 45', '')

          # Add the catalogue button only inside the Music section.
          marker = '</div>\n</section>\n<section id="calendar">'
          button = '''</div>\n<div style="text-align:center;margin:42px 0 8px">\n  <a href="songs.html" style="display:inline-block;padding:14px 28px;border:1px solid #c8a56a;border-radius:6px;color:#c8a56a;text-decoration:none;font-weight:700;letter-spacing:2px;background:#0b0b0b">♫ SONGS CATALOGUE — 45</a>\n</div>\n</section>\n<section id="calendar">'''

          music_start = s.find('<section id="music"')
          calendar_start = s.find('<section id="calendar">')
          if music_start == -1 or calendar_start == -1 or calendar_start <= music_start:
              raise SystemExit('Music/calendar sections not found')
          music = s[music_start:calendar_start]
          if 'href="songs.html"' not in music:
              if marker not in music:
                  raise SystemExit('Music section closing marker not found')
              music = music.replace(marker, button, 1)
              s = s[:music_start] + music + s[calendar_start:]

          p.write_text(s, encoding='utf-8')
      - name: Remove old one-time workflow and commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-songs-catalogue.yml
          git commit -m 'Place songs catalogue inside Music section'
          git push
