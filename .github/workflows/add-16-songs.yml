name: Add 16 Songs To Catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-16-songs.yml'
      - 'SBR-0030_preview.mp3'
      - 'SBR-0031_preview.mp3'
      - 'SBR-0032_preview.mp3'
      - 'SBR-0033_preview.mp3'
      - 'SBR-0034_preview.mp3'
      - 'SBR-0035_preview.mp3'
      - 'SBR-0036_preview.mp3'
      - 'SBR-0037_preview.mp3'
      - 'SBR-0038_preview.mp3'
      - 'SBR-0039_preview.mp3'
      - 'SBR-0040_preview.mp3'
      - 'SBR-0041_preview.mp3'
      - 'SBR-0042_preview.mp3'
      - 'SBR-0043_preview.mp3'
      - 'SBR-0044_preview.mp3'
      - 'SBR-0045_preview.mp3'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix released song cards
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- NASOS RELEASED SONG CARDS PATCH -->'
          if marker not in text:
              patch = r'''<!-- NASOS RELEASED SONG CARDS PATCH -->
<script>
(function(){
  const photo='ChatGPT%20Image%2017%20%CE%91%CF%85%CE%B3%202026%2C%2012_33_57%20%CF%80.%CE%BC..png';
  const songs=[
    {title:'Δεν Με Ξέρεις',search:'ΝΑΣΟΣ Δεν Με Ξέρεις',photo:true},
    {title:'Μη Φύγεις',search:'ΝΑΣΟΣ Μη Φύγεις',photo:true},
    {title:'Μη Μου Λες Αντίο',search:'ΝΑΣΟΣ Μη Μου Λες Αντίο',photo:false},
    {title:'Δώσε Μου Θάλασσα Να Πιω',search:'ΝΑΣΟΣ Δώσε Μου Θάλασσα Να Πιω',photo:false}
  ];
  function add(){
    document.querySelectorAll('.music').forEach(card=>{
      const t=(card.innerText||'').replace(/\s+/g,' ');
      const song=songs.find(x=>t.includes(x.title));
      if(!song||card.dataset.nasosPatched)return;
      card.dataset.nasosPatched='1';
      const cover=card.querySelector('.cover');
      if(song.photo&&cover){
        cover.innerHTML='<img src="'+photo+'" alt="ΝΑΣΟΣ — '+song.title+'" style="width:100%;height:100%;object-fit:cover;display:block;">';
        cover.style.padding='0';cover.style.overflow='hidden';
      }
      const link=document.createElement('a');
      link.href='https://open.spotify.com/search/'+encodeURIComponent(song.search);
      link.target='_blank';link.rel='noopener';link.textContent='♫ SPOTIFY';
      link.style.cssText='display:inline-block;margin-left:10px;background:transparent;color:#eee;border:1px solid #555;padding:10px 18px;text-decoration:none;font-weight:700;';
      const b=card.querySelector('button');
      if(b&&b.parentNode)b.parentNode.appendChild(link);else card.appendChild(link);
    });
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',add);else add();
})();
</script>
'''
              text=text.replace('</body>',patch+'</body>',1)
              p.write_text(text,encoding='utf-8')

      - name: Append SBR-0030 to SBR-0045
        shell: python
        run: |
          from pathlib import Path
          p = Path('songs.html')
          text = p.read_text(encoding='utf-8')
          if 'SBR-0030' in text:
              print('SBR-0030 already present; nothing to do.')
              raise SystemExit(0)

          cards = []
          for n in range(30, 46):
              cards.append(f'''<article class="card"><div class="id">SBR-{n:04d}</div><div class="title">SBR-{n:04d}</div><div class="meta"><div><b>Genre</b><br>Original</div><div><b>Preview</b><br>1:00</div><div><b>Status</b><br>Available</div><div><b>Catalogue</b><br>Specialist Bond Records</div></div><span class="status">AVAILABLE</span><audio controls preload="metadata" src="SBR-{n:04d}_preview.mp3"></audio></article>''')

          insertion = '\n'.join(cards) + '\n'
          text = text.replace('</main>', insertion + '</main>', 1)
          text = text.replace('SBR-0001 — SBR-0029', 'SBR-0001 — SBR-0045', 1)
          text = text.replace('29 original songs by Νάσος.', '45 original songs by Νάσος.', 1)
          p.write_text(text, encoding='utf-8')

      - name: Commit catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html songs.html
          if git diff --cached --quiet; then
            echo "No catalogue changes."
          else
            git commit -m "Fix released song photos and Spotify links"
            git push
          fi
